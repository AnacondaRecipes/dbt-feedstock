test:
  source_files:
    - tests
    - core
  imports:
    - dbt
    - dbt.adapters
  commands:
    - pip check
    - dbt --help
    # Tests are not adapted for py313:
    # >   raise AttributeError(item)
    # E   AttributeError: __class_getitem__
    # Can be fixed by using the latest typing_extensions in tests.
    - python -m pytest -vvv {{ deselect_tests }} tests/unit  # [py<313]
  requires:
    - pip
    - pytest >=7.4,<8.0
    - pytest-mock
    - dbt-postgres  # [py<314]
    - hypothesis
    - freezegun
    - opentelemetry-sdk

about:
  home: https://github.com/dbt-labs/dbt
  summary: With dbt, data analysts and engineers can build analytics the way engineers build applications.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  description: |
    dbt enables data analysts and engineers to transform their data using the same practices that software engineers use to build applications.
  dev_url: https://github.com/dbt-labs/dbt-core
  doc_url: https://docs.getdbt.com

extra:
  recipe-maintainers:
    - drewbanin
    - jthandy
    - maresb
    - thewchan
